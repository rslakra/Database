services:
  pinecone:
    # Pinecone Local (in-memory emulator for dev/CI): https://docs.pinecone.io/guides/operations/local-development
    image: ghcr.io/pinecone-io/pinecone-local:latest
    container_name: pinecone-local
    restart: unless-stopped
    environment:
      PORT: 5080
      PINECONE_HOST: localhost
    ports:
      - "5080-5090:5080-5090"
    platform: linux/amd64
