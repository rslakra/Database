services:
  postgresql:
    image: postgres:18
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dummy}
    # Force TCP on all interfaces (overrides any persisted postgresql.conf)
    command: ["postgres", "-c", "listen_addresses=*"]
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    # set shared memory limit when using docker compose
    # shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
      # PG 18+: mount parent dir (not /data) — see README "Core Rules"
      - ${POSTGRES_DATA_DIR:-./data}:/var/lib/postgresql
    networks:
      postgres-network:
        aliases:
          - db
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d dummy"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s

  # Web UI — pgweb auto-connects via PGWEB_DATABASE_URL (no login form).
  # Run docker compose up, wait for it to initialize completely, and visit http://localhost:8080 or http://host-ip:8080 (as appropriate).
  postgres-admin:
    image: sosedoff/pgweb:0.16.2
    container_name: postgres-admin
    restart: always
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      PGWEB_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgresql:5432/${POSTGRES_DB:-dummy}?sslmode=disable
    ports:
      - "8080:8081"
    networks:
      - postgres-network

networks:
  postgres-network:
    driver: bridge
